<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>My Portfolio</title></head><body><header><div><h1>My Portfolio</h1><p>株式・資産管理</p></div><div class="header-actions"><button id="exportBtn" type="button">バックアップ</button><button id="importBtn" type="button">復元</button><input id="importFile" type="file" accept="application/json" hidden><button id="installBtn" hidden type="button">ホーム画面に追加</button></div></header><main><section class="summary"><article><span>総資産（円換算）</span><strong id="totalAssets">¥0</strong><small id="updatedAt">未更新</small></article><article><span>評価損益</span><strong id="profitLoss">¥0</strong></article><article><span>現金残高</span><strong id="cashBalance">¥0</strong></article></section><section class="card"><div class="head"><h2>保有銘柄</h2><div><button id="refreshPricesBtn" type="button">株価を更新</button><button id="addTxBtn">取引を追加</button></div></div><div id="holdingsEmpty" class="empty">取引履歴を登録すると保有銘柄が表示されます。</div><div class="scroll"><table id="holdingsTable" hidden><thead><tr><th>銘柄</th><th>数量</th><th>平均取得</th><th>現在値</th><th>評価額</th><th>損益</th><th></th></tr></thead><tbody></tbody></table></div></section><section class="card"><div class="head"><h2>現金残高</h2><button id="addCashBtn">現金を追加</button></div><div class="fx-setting">ドル円換算レート <input id="fxRate" type="number" min="0.01" step="0.01" aria-label="ドル円換算レート"> 円 / USD <button id="saveFx" type="button">保存</button></div><div id="cashList" class="cash-list"></div></section><section class="card"><div class="head"><h2>取引履歴</h2><div><button id="csvImportBtn" type="button">CSV取込</button><input id="csvFile" type="file" accept=".csv,text/csv" hidden></div></div><div class="scroll"><table id="txTable"><thead><tr><th>日付</th><th>銘柄</th><th>売買</th><th>数量</th><th>単価</th><th>手数料</th><th></th></tr></thead><tbody></tbody></table></div><div id="txEmpty" class="empty">取引履歴はありません。</div></section></main><dialog id="txDialog"><form id="txForm"><input name="id" type="hidden"><h2>取引を追加</h2><label>口座名<input name="account" maxlength="40" placeholder="例：SBI証券 NISA" required></label><label>資産種類<select name="assetType"><option value="STOCK_JP">日本株</option><option value="STOCK_US">米国株</option><option value="FUND">投資信託</option><option value="ETF">ETF</option></select></label><label>日付<input name="date" type="date" required></label><div class="row"><label>市場<select name="market"><option value="JP">日本株</option><option value="US">米国株</option></select></label><label>売買<select name="side"><option value="BUY">買い</option><option value="SELL">売り</option></select></label></div><label>銘柄コード / ティッカー<input name="symbol" required></label><label>銘柄名<input name="name" required></label><div class="row"><label>数量<input name="quantity" type="number" min="0.000001" step="any" required></label><label>約定単価<input name="price" type="number" min="0" step="any" required></label></div><label>手数料<input name="fee" type="number" min="0" step="any" value="0"></label><div class="actions"><button type="button" data-close>キャンセル</button><button>保存</button></div></form></dialog><dialog id="cashDialog"><form id="cashForm"><h2>現金残高を追加</h2><label>口座名<input name="account" maxlength="40" placeholder="例：楽天証券、三井住友銀行" required></label><label>通貨<select name="currency"><option value="JPY">日本円</option><option value="USD">米ドル</option></select></label><label>残高<input name="amount" type="number" step="any" required></label><div class="actions"><button type="button" id="cancelCashBtn">キャンセル</button><button>保存</button></div></form></dialog><dialog id="priceDialog"><form id="priceForm"><h2>現在値を登録</h2><input name="key" type="hidden"><p id="priceLabel"></p><label>現在値<input name="price" type="number" min="0" step="any" required></label><div class="actions"><button type="button" data-close>キャンセル</button><button>保存</button></div></form></dialog><footer>データはこの端末のブラウザ内にのみ保存されます。バックアップを定期的に保存してください。</footer><script src="app.js"></script></body></html>
